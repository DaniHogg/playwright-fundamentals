name: Playwright Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libnspr4 libatk-bridge2.0-0 libdrm2 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxrandr2 libgbm1 libxss1 libasound2 || true

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run Playwright JS tests
        env:
          BASE_URL: https://danihogg.github.io
          SITE_BASE_PATH: /qa-portfolio-livesite
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
          PLAYWRIGHT_JSON_OUTPUT_DIR: playwright-report
        run: npx playwright test --project=chromium --project=firefox --reporter=list,html,json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Playwright Python tests
        env:
          BASE_URL: https://danihogg.github.io
          SITE_BASE_PATH: /qa-portfolio-livesite
        run: pytest test-py -v -n auto --tracing=retain-on-failure --screenshot=only-on-failure --video=retain-on-failure

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: html-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright JSON report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-json
          path: playwright-report/results.json
          if-no-files-found: error
          retention-days: 14

  notify-portfolio:
    # Refresh the live portfolio dashboard after tests complete on main branch
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      needs.test.result != 'cancelled' &&
      vars.PORTFOLIO_SITE_REPO != ''
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch portfolio refresh
        env:
          GH_TOKEN: ${{ secrets.PORTFOLIO_SITE_TOKEN }}
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/${{ vars.PORTFOLIO_SITE_REPO }}/dispatches \
            -d @- <<JSON
          {
            "event_type": "portfolio-results-ready",
            "client_payload": {
              "source_repo": "${{ github.repository }}",
              "source_workflow": "tests.yml",
              "source_artifact": "playwright-json",
              "source_branch": "${{ github.ref_name }}",
              "source_run_id": "${{ github.run_id }}",
              "source_run_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "source_commit_sha": "${{ github.sha }}"
            }
          }
          JSON
